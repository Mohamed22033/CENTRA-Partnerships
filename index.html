<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CENTRA | Cybersecurity Partnerships Portal</title>
  <!-- الخطوط: Orbitron للعناوين + Rajdhani للنص -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- خلفية الجزيئات المتحركة (بتتحكم فيها script.js) -->

    <h1 id="companyName">CENTRA</h1>
    <p class="tagline" id="tagline"></p>

  <!-- ===== كروت المهندسين (بتتعمل من DATA في script.js) ===== -->

  <script src="script.js"></script>
